name: CI

# Перевірки запускаються на кожен push у main і на кожен pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Нова перевірка скасовує попередню для тієї ж гілки/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bot:
    name: Бот (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q bot
      - run: python -m pytest tests -q

  miniapp:
    name: Міні-застосунок (синтаксис + прогін екранів)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt pytest
      - run: python tests/make_fixture.py "$RUNNER_TEMP/fixture.json"
      - run: npm install --no-save --no-audit --no-fund jsdom
      - run: node tests/check_miniapp.js "$RUNNER_TEMP/fixture.json"
