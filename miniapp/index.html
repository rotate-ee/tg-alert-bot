<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Розклад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
 --bg:var(--tg-theme-bg-color,#fbfbfd);--tx:var(--tg-theme-text-color,#14161a);--hint:var(--tg-theme-hint-color,#7b8087);
 --card:var(--tg-theme-secondary-bg-color,#eff1f5);--ac:var(--tg-theme-button-color,#2f7cf6);--act:var(--tg-theme-button-text-color,#fff);
 --line:color-mix(in srgb,var(--tx) 10%,transparent);
}
@media(prefers-color-scheme:dark){:root:not([style*="--tg-theme-bg-color"]){--bg:#101216;--tx:#eceef2;--hint:#8b919a;--card:#1a1d23}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.top h1{font-size:26px;line-height:1.1;margin:0;font-weight:750;letter-spacing:-.02em}
.top small{display:block;color:var(--hint);font-size:14px;margin-top:3px}
.wk{padding:6px 11px;border-radius:99px;background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.strip button{padding:9px 0 8px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.strip b{font-size:13px;font-weight:600;color:var(--hint)}.strip span{font-size:18px;font-weight:700}
.strip .sel{background:var(--ac);color:var(--act)}.strip .sel b{color:inherit;opacity:.8}
.strip .tod::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--ac)}
.strip .sel.tod::after{background:var(--act)}
.nav{display:flex;justify-content:space-between;margin-bottom:14px;color:var(--hint);font-size:14px}
.nav button{padding:6px 4px;color:var(--ac);font-weight:600}
.hero{border-radius:22px;padding:18px;margin-bottom:16px;background:var(--card);position:relative;overflow:hidden}
.hero.live{background:var(--ac);color:var(--act)}
.hero .k{font-size:14px;opacity:.8}
.hero .t{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.15;margin:4px 0 12px}
.hero .m{display:flex;justify-content:space-between;font-size:14px;opacity:.9;margin-top:8px}
.bar{height:8px;border-radius:9px;background:color-mix(in srgb,currentColor 25%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:currentColor;transition:width .6s}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:50px 5px 1fr auto;gap:12px;align-items:stretch;padding:9px 0;text-align:left;width:100%}
.row .tm{font-size:14px;line-height:1.25;text-align:right}.row .tm span{color:var(--hint);display:block;font-size:12.5px}
.row .cl{border-radius:5px;background:var(--c)}
.row .bd b{display:block;font-size:17px;font-weight:650}.row .bd span{color:var(--hint);font-size:13.5px}
.row .nb{font-size:13px;color:var(--hint);align-self:center}
.row.past{opacity:.45}.row.now .bd b{color:var(--ac)}
.row.gap{padding:0 0 0 62px;height:20px;align-items:center;color:var(--hint);font-size:12px}
.empty{background:var(--card);border-radius:18px;padding:28px 16px;text-align:center;color:var(--hint)}
.hw{margin-top:18px}.hw h2{font-size:17px;margin:0 0 8px}
.hw .it{background:var(--card);border-radius:14px;padding:10px 13px;margin-bottom:6px;font-size:15px}
.hw .it b{display:block;font-size:13px;color:var(--hint);font-weight:600;margin-bottom:2px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:9}
.sheet.on{display:flex}
.sheet .p{width:100%;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.p h3{margin:0 0 2px;font-size:20px}.p .s{color:var(--hint);font-size:14px;margin-bottom:12px}
.p textarea{width:100%;min-height:96px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:12px;font:inherit;resize:none}
.p .bt{display:flex;gap:8px;margin-top:10px}
.p .bt button{flex:1;padding:12px;border-radius:13px;background:var(--card);font-weight:600}
.p .bt .go{background:var(--ac);color:var(--act)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><div><h1 id="ttl"></h1><small id="sub"></small></div><div class="wk" id="wk"></div></div>
<div class="strip" id="strip"></div>
<div class="nav"><button id="prev">‹ Минулий тиждень</button><button id="today">Сьогодні</button><button id="next">Наступний ›</button></div>
<div id="hero"></div>
<div class="list" id="list"></div>
<div class="hw" id="hw"></div>
<div class="sheet" id="sheet"><div class="p" id="panel"></div></div>

<script>
const S={bells:{1:["11:25","12:10"],2:["12:25","13:10"],3:["13:25","14:10"],4:["14:15","15:00"],5:["15:05","15:50"],6:["15:55","16:40"],7:["17:05","17:50"],8:["17:55","18:40"]},remote:[7,8],
days:{0:["Математика","Англ. мова","Укр. мова","Укр. літ","Хімія","Фіз-ра","Історія"],
1:["Правознавство","Укр. мова","Біологія","Зар. літ","Інформатика",{"1_2":"Мистецтво","3_4":"Музика"},"ЗБД",{"3_4":"Підприємництво"}],
2:["Фізика","Англ. мова",{"1_2":"Громадянська освіта","3_4":"Історія"},"Географія","Укр. літ","Математика","Математика"],
3:["Фіз-ра","Зар. літ","Математика","Хімія","Фізика","Інформатика","Технології"],
4:["Фіз-ра","Історія","Біологія","Фізика","Укр. мова","Математика","Англ. мова"],5:[],6:[]},
rooms:{0:["303","318","316","316","325",null,"304"],1:["309","316","321","325","310",{"1_2":"222","3_4":"206"},"304",{"3_4":"314"}],
2:["206","318","304","314","316","303","303"],3:[null,"222","303","325","210","310","103/101"],4:[null,"304","321","202","316","303","318"],5:[],6:[]},
anchor:"2026-09-07"};
const HUE={"Математика":215,"Англ":340,"Укр. мова":45,"Укр. літ":30,"Хімія":150,"Фіз-ра":8,"Історія":22,"Біологія":125,"Фізика":262,"Зар. літ":295,"Інформатика":190,"Географія":95,"ЗБД":0,"Правознавство":235,"Мистецтво":320,"Музика":320,"Технології":70,"Підприємництво":170,"Громадянська":235};
const col=n=>{const k=Object.keys(HUE).find(k=>n.startsWith(k));const h=k?HUE[k]:[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360;return k==="ЗБД"?"hsl(0 0% 55%)":`hsl(${h} 68% 56%)`};
const DN=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"],DF=["Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота","Неділя"];
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const hap=t=>{try{tg&&tg.HapticFeedback.selectionChanged()}catch(e){}};
const D=864e5,$=id=>document.getElementById(id);
function kyiv(){const p=Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Kyiv",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));return new Date(Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute))}
const wd=d=>(d.getUTCDay()+6)%7,day0=d=>new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
const key=d=>d.toISOString().slice(0,10),fmt=d=>String(d.getUTCDate()).padStart(2,"0")+"."+String(d.getUTCMonth()+1).padStart(2,"0");
const group=d=>Math.floor((d.getUTCDate()-1)/7)+1<=2?"1_2":"3_4";
const monOf=d=>new Date(day0(d).getTime()-wd(d)*D);
const isSchool=d=>Math.floor((monOf(d)-new Date(S.anchor+"T00:00:00Z"))/D/7)%2===0;
const pick=(e,g)=>e&&typeof e==="object"?e[g]||null:e;
const mins=s=>{const[a,b]=s.split(":");return+a*60+ +b};
function lessons(d){const w=wd(d),g=group(d),sc=isSchool(d),o=[];
 (S.days[w]||[]).forEach((e,i)=>{const name=pick(e,g);if(!name)return;const n=i+1,rem=S.remote.includes(n);
  o.push({n,name,remote:rem&&sc,room:sc&&!rem?pick((S.rooms[w]||[])[i],g):null,start:S.bells[n][0],end:S.bells[n][1]})});return o}
let notes={};try{notes=JSON.parse(localStorage.getItem("hw")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("hw",JSON.stringify(notes))}catch(e){}};
let now=kyiv(),off=0,sel=null;
function baseMon(){return new Date(monOf(now).getTime()+(wd(now)>4?7*D:0)+off*7*D)}
function initSel(){sel=wd(now)>4?new Date(baseMon()):day0(now)}
const nm=l=>l.name+(l.remote?" (дист.)":"");
function render(){
 now=kyiv();const t=day0(now),cur=now.getUTCHours()*60+now.getUTCMinutes(),mon=baseMon();
 if(!sel)initSel();
 $("ttl").textContent=DF[wd(sel)];
 $("sub").textContent=fmt(sel)+"."+sel.getUTCFullYear();
 $("wk").textContent=isSchool(sel)?"🏫 Очно":"🏠 Вдома";
 $("strip").innerHTML=[0,1,2,3,4].map(i=>{const d=new Date(mon.getTime()+i*D);return `<button data-d="${key(d)}" class="${key(d)===key(sel)?"sel ":""}${key(d)===key(t)?"tod":""}"><b>${DN[i]}</b><span>${d.getUTCDate()}</span></button>`}).join("");
 const L=lessons(sel),isT=key(sel)===key(t),H=$("hero");
 if(!L.length){H.innerHTML=`<div class="hero"><div class="t">Уроків немає</div><div class="k">Можна відпочити</div></div>`}
 else if(isT){
  const c=L.find(l=>cur>=mins(l.start)&&cur<mins(l.end)),nx=L.find(l=>mins(l.start)>cur),last=L[L.length-1];
  if(c){const p=(cur-mins(c.start))/(mins(c.end)-mins(c.start))*100;
   H.innerHTML=`<div class="hero live"><div class="k">Зараз ${c.n}-й урок${c.room?", каб. "+c.room:""}</div><div class="t">${nm(c)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="m"><span>${c.start}</span><span>ще ${mins(c.end)-cur} хв</span><span>${c.end}</span></div></div>`}
  else if(nx){const w=mins(nx.start)-cur;
   H.innerHTML=`<div class="hero"><div class="k">${cur<mins(L[0].start)?"Уроки ще не почались":"Перерва"}</div><div class="t">${nm(nx)}</div><div class="k">${nx.n}-й урок о ${nx.start}${nx.room?", каб. "+nx.room:""}, через ${w>=60?Math.floor(w/60)+" год "+w%60+" хв":w+" хв"}</div></div>`}
  else H.innerHTML=`<div class="hero"><div class="t">Уроки закінчились</div><div class="k">Останній був о ${last.end}</div></div>`;
 } else {const a=L[0],z=L[L.length-1];
  H.innerHTML=`<div class="hero"><div class="k">${sel<t?"Було":"Буде"} уроків: ${L.length}</div><div class="t">${a.start} – ${z.end}</div><div class="k">Перший: ${nm(a)}</div></div>`}
 let h="";
 L.forEach((l,i)=>{const cl=isT?(cur>=mins(l.end)?"past":cur>=mins(l.start)?"now":""):(sel<t?"past":"");
  if(i){const g=mins(l.start)-mins(L[i-1].end);if(g>=30)h+=`<div class="row gap">вікно ${Math.floor(g/60)?Math.floor(g/60)+" год ":""}${g%60?g%60+" хв":""}</div>`}
  h+=`<button class="row ${cl}" data-n="${l.n}" style="--c:${col(l.name)}"><div class="tm">${l.start}<span>${l.end}</span></div><div class="cl"></div><div class="bd"><b>${l.name}</b><span>${l.n}-й урок${l.room?", каб. "+l.room:""}${l.remote?", дистанційно":""}</span></div><div class="nb">${notes[key(sel)+"|"+l.n]?"📝":""}</div></button>`});
 $("list").innerHTML=h;
 const ni=Object.keys(notes).filter(k=>k>=key(t)&&notes[k]).sort().slice(0,6);
 $("hw").innerHTML=ni.length?`<h2>Нагадування</h2>`+ni.map(k=>{const[d,n]=k.split("|"),dd=new Date(d+"T00:00:00Z"),l=lessons(dd).find(x=>x.n==n);return `<div class="it"><b>${DN[wd(dd)]} ${fmt(dd)}, ${l?l.name:n+"-й урок"}</b>${notes[k].replace(/</g,"&lt;")}</div>`}).join(""):"";
}
$("strip").onclick=e=>{const b=e.target.closest("button");if(!b)return;sel=new Date(b.dataset.d+"T00:00:00Z");hap();render()};
$("prev").onclick=()=>{off--;sel=new Date(sel.getTime()-7*D);hap();render()};
$("next").onclick=()=>{off++;sel=new Date(sel.getTime()+7*D);hap();render()};
$("today").onclick=()=>{off=0;sel=null;hap();render()};
$("list").onclick=e=>{const b=e.target.closest(".row[data-n]");if(!b)return;const n=+b.dataset.n,l=lessons(sel).find(x=>x.n===n),k=key(sel)+"|"+n;
 $("panel").innerHTML=`<h3>${l.name}</h3><div class="s">${DF[wd(sel)]}, ${fmt(sel)}, ${l.n}-й урок</div><textarea id="ta" placeholder="Що задали або що взяти з собою">${(notes[k]||"").replace(/</g,"&lt;")}</textarea><div class="bt"><button id="cx">Закрити</button>${notes[k]?'<button id="dl">Видалити</button>':""}<button class="go" id="sv">Зберегти</button></div>`;
 $("sheet").classList.add("on");
 $("cx").onclick=()=>$("sheet").classList.remove("on");
 $("sv").onclick=()=>{const v=$("ta").value.trim();if(v)notes[k]=v;else delete notes[k];save();$("sheet").classList.remove("on");render()};
 if($("dl"))$("dl").onclick=()=>{delete notes[k];save();$("sheet").classList.remove("on");render()}};
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").classList.remove("on")};
render();setInterval(()=>{if(!$("sheet").classList.contains("on"))render()},20000);
</script>
</body>
</html>
