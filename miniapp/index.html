<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Розклад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fbfbfd);--tx:var(--tg-theme-text-color,#14161a);--hint:var(--tg-theme-hint-color,#7b8087);--card:var(--tg-theme-secondary-bg-color,#eff1f5);--ac:var(--tg-theme-button-color,#2f7cf6);--act:var(--tg-theme-button-text-color,#fff);--line:color-mix(in srgb,var(--tx) 12%,transparent);--ok:#23956a;--yl:#d99a00;--rd:#e0383e}
@media(prefers-color-scheme:dark){:root:not([style*="--tg-theme-bg-color"]){--bg:#101216;--tx:#eceef2;--hint:#8b919a;--card:#1a1d23}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top,0px)) 14px calc(92px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
h1{font-size:26px;line-height:1.1;margin:0;font-weight:750;letter-spacing:-.02em}h2{font-size:18px;margin:22px 0 8px}
small,.sm{color:var(--hint);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;gap:8px}
.pill{padding:6px 11px;border-radius:99px;background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.ban{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:14px;margin-bottom:12px;text-align:left;font-weight:600;color:#fff;background:var(--ok)}
.ban.yl{background:var(--yl)}.ban.rd{background:var(--rd)}.ban.off{background:var(--card);color:var(--hint)}.ban span{margin-left:auto;font-weight:500;opacity:.85;font-size:13px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.strip button{padding:9px 0 8px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;position:relative}
.strip b{font-size:13px;font-weight:600;color:var(--hint)}.strip span{font-size:18px;font-weight:700}
.strip .sel{background:var(--ac);color:var(--act)}.strip .sel b{color:inherit;opacity:.8}
.strip .tod::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--ac)}.strip .sel.tod::after{background:var(--act)}
.strip .hol:not(.sel){background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.nav{display:flex;justify-content:space-between;margin-bottom:14px}.nav button{padding:6px 4px;color:var(--ac);font-weight:600;font-size:14px}
.hero{border-radius:22px;padding:18px;margin-bottom:16px;background:var(--card)}
.hero.live{background:var(--ac);color:var(--act)}.hero.hol{background:var(--ok);color:#fff}
.hero .k{font-size:14px;opacity:.85}.hero .t{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.15;margin:4px 0 10px}
.bar{height:8px;border-radius:9px;background:color-mix(in srgb,currentColor 25%,transparent);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:currentColor;transition:width .6s}
.m{display:flex;justify-content:space-between;font-size:14px;margin-top:8px;opacity:.9}
.row{display:grid;grid-template-columns:50px 5px 1fr auto;gap:12px;padding:9px 0;text-align:left;width:100%}
.tm{font-size:14px;line-height:1.25;text-align:right}.tm span{color:var(--hint);display:block;font-size:12.5px}
.cl{border-radius:5px;background:var(--c)}.bd b{display:block;font-size:17px;font-weight:650}.bd span{color:var(--hint);font-size:13.5px}
.nb{font-size:13px;color:var(--hint);align-self:center}.row.past{opacity:.45}.row.now .bd b{color:var(--ac)}
.row.cx .bd b{text-decoration:line-through;color:var(--hint)}.row.cx .cl{background:var(--hint)}
.tag{color:var(--rd)!important;font-weight:600}
.box{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.box b{display:block}.hl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.al{border-radius:24px;padding:22px 18px;color:#fff;background:var(--ok);margin-bottom:12px}
.al.yl{background:var(--yl)}.al.rd{background:var(--rd);animation:pulse 3s ease-in-out infinite}.al.off{background:var(--card);color:var(--hint)}
.al .t{font-size:30px;font-weight:780;letter-spacing:-.02em;line-height:1.1;margin:2px 0 6px}.al .k{opacity:.9;font-size:15px}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--rd) 22%,transparent)}}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}.st .box{margin:0}.st b{font-size:24px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--yl)}.dot.red{background:var(--rd)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.tabs button{flex:1;padding:11px 4px;border-radius:13px;font-weight:600;font-size:14px;color:var(--hint)}.tabs .on{background:var(--card);color:var(--tx)}
.b2{padding:8px 12px;border-radius:11px;background:var(--bg);font-weight:600;font-size:14px}.b2.rd{color:var(--rd)}
.go{width:100%;padding:13px;border-radius:14px;background:var(--ac);color:var(--act);font-weight:650;margin-top:8px}
input,textarea,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:8px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:13px;color:var(--hint);display:block;margin-bottom:3px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:9}.sheet.on{display:flex}
.sheet .p{width:100%;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.empty{background:var(--card);border-radius:18px;padding:26px 16px;text-align:center;color:var(--hint)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabs" id="tabs"></div>
<div class="sheet" id="sheet"><div class="p" id="panel"></div></div>
<div class="toast" id="toast"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const qs=new URLSearchParams(location.search);
let API=qs.get("api")||localStorage.getItem("api")||"";if(qs.get("api"))localStorage.setItem("api",API);
const hdr=()=>({"Content-Type":"application/json","X-Init-Data":tg?tg.initData:""});
const get=async p=>{const r=await fetch(API+p,{headers:hdr()});if(!r.ok)throw r.status;return r.json()};
const post=async(p,b)=>{const r=await fetch(API+p,{method:"POST",headers:hdr(),body:JSON.stringify(b)});if(!r.ok)throw r.status;return r.json()};
const $=id=>document.getElementById(id),D=864e5,esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DN=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"],DF=["Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота","Неділя"];
const HUE={"Математика":215,"Англ":340,"Укр. мова":45,"Укр. літ":30,"Хімія":150,"Фіз-ра":8,"Історія":22,"Біологія":125,"Фізика":262,"Зар. літ":295,"Інформатика":190,"Географія":95,"ЗБД":0,"Правознавство":235,"Мистецтво":320,"Музика":320,"Технології":70,"Підприємництво":170,"Громадянська":235};
const col=n=>{const k=Object.keys(HUE).find(k=>n.startsWith(k));const h=k?HUE[k]:[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360;return k==="ЗБД"?"hsl(0 0% 55%)":`hsl(${h} 68% 56%)`};
function kyiv(){const p=Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Kyiv",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));return new Date(Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute))}
const iso=d=>d.toISOString().slice(0,10),fd=s=>s.slice(8,10)+"."+s.slice(5,7),U=s=>new Date(s+"T00:00:00Z"),wd=d=>(d.getUTCDay()+6)%7;
const mins=s=>{const[a,b]=s.split(":");return+a*60+ +b},fm=m=>m>=60?Math.floor(m/60)+" год "+(m%60?m%60+" хв":""):m+" хв";
const mon=d=>new Date(U(iso(d)).getTime()-wd(d)*D);
let tab="sch",off=0,sel=null,st=null,offline=false,admin=false,adminDay=null,adminDate=null,adminOv=null,wv=false,curL=null;
const E=l=>l.early_end||l.end;
let notes={};try{notes=JSON.parse(localStorage.getItem("hw")||"{}")}catch(e){}
const saveN=()=>{try{localStorage.setItem("hw",JSON.stringify(notes))}catch(e){}};
const hap=()=>{try{tg&&tg.HapticFeedback.selectionChanged()}catch(e){}};
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)};
const sheet=h=>{$("panel").innerHTML=h;$("sheet").classList.add("on")},closeSheet=()=>$("sheet").classList.remove("on");
$("sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
const lvl=a=>a.level==="red"?"Червоний рівень":a.level==="yellow"?"Жовтий рівень":"Тривога";
const cls=a=>!a.active?"":a.level==="yellow"?"yl":"rd";
const dur=m=>m<1?"щойно":fm(m);
const since=a=>a.since?Math.max(0,Math.floor((Date.now()-Date.parse(a.since))/6e4)):null;

async function load(){
 const now=kyiv();let base=new Date(mon(now).getTime()+(wd(now)>4?7*D:0)+off*7*D);
 try{st=await get(`/api/state?from=${iso(base)}&days=7`);offline=false;if(st.maintenance)return;st.base=iso(base);try{localStorage.setItem("cache",JSON.stringify(st))}catch(e){}}
 catch(e){try{st=JSON.parse(localStorage.getItem("cache")||"null")}catch(_){st=null}offline=!!st;if(!st){st={err:true}}}
 if(!sel||!st.days||!st.days[sel])sel=st.base&&(wd(now)>4||off)?st.base:iso(now);
 if(st.days&&!st.days[sel])sel=st.base;
}
async function loadAdmin(){try{admin=(await get("/api/me")).admin}catch(e){admin=false}}
async function loadAdminDay(){adminDate=adminDate||iso(kyiv());try{adminDay=(await get(`/api/state?from=${adminDate}&days=1`)).days[adminDate]}catch(e){adminDay=null}try{adminOv=await get("/api/admin/overview")}catch(e){adminOv=null}}
const act=async(fn,ok)=>{try{await fn();toast(ok);await load();await loadAdminDay();render()}catch(x){toast("Помилка: "+(x===403?"немає прав":"спробуйте ще раз"))}};
const undo=c=>c.kind==="cancel"?post("/api/admin/cancel",{date:c.date,number:c.number,cancel:false}):c.kind==="time"?post("/api/admin/time",{date:c.date,number:c.number,clear:true}):c.kind==="early"?post("/api/admin/endnow",{date:c.date,number:c.number,clear:true}):c.kind==="inperson"?post("/api/admin/inperson",{date:c.date,number:c.number,value:false}):post("/api/admin/lesson",{date:c.date,number:c.number,remove:true});

function banner(){const a=st.alert;return `<button class="ban ${a.active?cls(a):""}" data-go="al">${a.active?"🚨 "+lvl(a):"🟢 Тривоги немає"}<span>${a.active&&since(a)!==null?dur(since(a)):"Детальніше"}</span></button>`}
function sch(){
 const now=kyiv(),t=iso(now),cur=now.getUTCHours()*60+now.getUTCMinutes(),day=st.days[sel],L=day.lessons;
 const days=Object.keys(st.days).slice(0,5);
 let h=`<div class="top"><div><h1>${wv?"Тиждень":DF[wd(U(sel))]}</h1><small>${wv?fd(days[0])+" – "+fd(days[4]):fd(sel)+"."+sel.slice(0,4)}</small></div><div style="display:flex;gap:6px"><div class="pill">${day.holiday?"🌴":day.school===false?"🏠":day.school?"🏫":""}</div><button class="pill" data-wv="${wv?0:1}">${wv?"День":"Тиждень"}</button></div></div>`;
 if(offline)h+=`<div class="box sm">Немає зв'язку з ботом. Показано збережені дані.</div>`;
 if(admin&&st.settings&&st.settings.maintenance)h+=`<div class="box sm" style="background:var(--yl);color:#fff">Увімкнено режим технічних робіт: користувачі бачать заглушку, а ви бачите застосунок як адмін.</div>`;
 h+=banner();
 h+=`<div class="strip">${days.map(k=>`<button data-d="${k}" class="${k===sel?"sel ":""}${k===t?"tod ":""}${st.days[k].holiday?"hol":""}"><b>${DN[wd(U(k))]}</b><span>${+k.slice(8)}</span></button>`).join("")}</div>`;
 h+=`<div class="nav"><button data-w="-1">‹ Минулий</button><button data-w="0">Сьогодні</button><button data-w="1">Наступний ›</button></div>`;
 if(wv)return h+wkv();
 const isT=sel===t,live=L.filter(l=>!l.cancelled),c=isT&&live.find(l=>cur>=mins(l.start)&&cur<mins(E(l))),nx=isT&&live.find(l=>mins(l.start)>cur);
 if(day.holiday){const left=Math.round((U(day.holiday.to)-U(sel))/D)+1;h+=`<div class="hero hol"><div class="k">${esc(day.holiday.title)}</div><div class="t">Уроків немає</div><div class="k">До ${fd(day.holiday.to)} включно, залишилось днів: ${left}</div></div>`}
 else if(!L.length)h+=`<div class="hero"><div class="t">Уроків немає</div><div class="k">${wd(U(sel))>4?"Вихідний":"Можна відпочити"}</div></div>`;
 else if(!isT){const a=live[0],z=live[live.length-1];h+=a?`<div class="hero"><div class="k">Уроків: ${live.length}</div><div class="t">${a.start} – ${z.end}</div><div class="k">Перший: ${esc(a.name)}</div></div>`:`<div class="hero"><div class="t">Усі уроки скасовано</div></div>`}
 else if(c){const p=(cur-mins(c.start))/(mins(E(c))-mins(c.start))*100;h+=`<div class="hero live"><div class="k">Зараз ${c.number}-й урок${c.room?", каб. "+esc(c.room):""}</div><div class="t">${esc(c.name)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="m"><span>${c.start}</span><span>ще ${mins(E(c))-cur} хв</span><span>${E(c)}</span></div></div>`}
 else if(nx){h+=`<div class="hero"><div class="k">${cur<mins(live[0].start)?"Уроки ще не почались":"Перерва"}</div><div class="t">${esc(nx.name)}</div><div class="k">${nx.number}-й урок о ${nx.start}${nx.room?", каб. "+esc(nx.room):""}, через ${fm(mins(nx.start)-cur)}</div></div>`}
 else h+=`<div class="hero"><div class="t">Уроки закінчились</div></div>`;
 h+=L.map(l=>{const k=sel+"|"+l.number,past=isT?cur>=mins(E(l)):sel<t,now_=isT&&!l.cancelled&&cur>=mins(l.start)&&cur<mins(E(l));
  return `<button class="row ${l.cancelled?"cx ":""}${past?"past ":""}${now_?"now":""}" data-n="${l.number}" style="--c:${col(l.name)}"><div class="tm">${l.start}<span>${E(l)}</span></div><div class="cl"></div><div class="bd"><b>${esc(l.name)}</b><span>${l.number}-й урок${l.room?", каб. "+esc(l.room):""}${l.remote?", дистанційно":""}${l.early_end?", закінчився раніше":""}${l.cancelled?' <i class="tag">скасовано</i>':""}</span></div><div class="nb">${notes[k]?"📝":""}</div></button>`}).join("");
 const nh=st.holidays.filter(x=>x.to>=t).slice(0,3);
 if(nh.length)h+=`<h2>Канікули</h2>`+nh.map(x=>{const d=Math.round((U(x.from)-U(t))/D);return `<div class="box"><b>${esc(x.title)}</b><span class="sm">${fd(x.from)} – ${fd(x.to)}, ${d>0?"через "+d+" дн.":"тривають"}</span></div>`}).join("");
 const ni=Object.keys(notes).filter(k=>k.slice(0,10)>=t&&notes[k]).sort().slice(0,5);
 if(ni.length)h+=`<h2>Нагадування</h2>`+ni.map(k=>`<div class="box"><b class="sm">${fd(k.slice(0,10))}, ${k.split("|")[1]}-й урок</b>${esc(notes[k])}</div>`).join("");
 return h}
function wkv(){const t=iso(kyiv());return Object.keys(st.days).slice(0,5).map(k=>{const d=st.days[k];return `<button class="box" data-d="${k}" data-wv="0" style="width:100%;text-align:left;${k===t?"outline:2px solid var(--ac)":""}"><div class="hl"><b>${DF[wd(U(k))]}, ${fd(k)}</b><span class="sm">${d.holiday?"🌴 "+esc(d.holiday.title):d.school===false?"🏠 вдома":d.school?"🏫 очно":""}</span></div>${d.holiday?"":d.lessons.length?d.lessons.map(l=>`<div class="sm" style="${l.cancelled?"text-decoration:line-through":""}">${l.number}. ${esc(l.name)}, ${l.start}${l.room?", каб. "+esc(l.room):""}</div>`).join(""):'<div class="sm">Уроків немає</div>'}</button>`}).join("")}
function alr(){
 const a=st.alert,m=since(a),ago=a.last_ok?Math.floor((Date.now()-Date.parse(a.last_ok))/1e3):null;
 let h=`<div class="top"><div><h1>Тривоги</h1><small>${esc(a.region)}</small></div></div>`;
 if(offline)h+=`<div class="box sm">Немає зв'язку з ботом. Дані можуть бути застарілими.</div>`;
 h+=`<div class="al ${a.active?cls(a):""}"><div class="k">${a.active?"Повітряна тривога":"Зараз"}</div><div class="t">${a.active?lvl(a):"Тривоги немає"}</div><div class="k">${a.active?(m!==null?"Триває "+(m<1?"менше хвилини":fm(m)):"Триває"):"Можна не поспішати в укриття"}</div></div>`;
 h+=`<div class="sm" style="margin:0 2px 12px">${ago===null?"Ще не було перевірки":"Перевірено "+(ago<60?ago+" с":Math.floor(ago/60)+" хв")+" тому"}</div>`;
 h+=`<div class="st"><div class="box"><span class="sm">Сьогодні тривог</span><b>${a.today.count}</b></div><div class="box"><span class="sm">Загалом</span><b>${a.today.minutes} хв</b></div></div>`;
 h+=`<h2>Історія</h2>`;
 if(!a.history.length)h+=`<div class="empty">Поки що записів немає. Бот почав вести журнал з моменту оновлення.</div>`;
 const t=iso(kyiv()),y=iso(new Date(U(t)-D));
 h+=a.history.map(x=>{const s=x.start,d=s.slice(0,10),e=x.end,dur=Math.max(0,Math.round(((e?Date.parse(e):Date.now())-Date.parse(s))/6e4));
  return `<div class="box hl"><div><b><i class="dot ${x.level==="red"?"red":""}"></i>${d===t?"Сьогодні":d===y?"Вчора":fd(d)}, ${s.slice(11,16)} – ${e?e.slice(11,16):"триває"}</b><span class="sm">${x.level==="red"?"Червоний":x.level==="yellow"?"Жовтий":"Рівень невідомий"} рівень</span></div><div class="sm">${fm(dur)||"<1 хв"}</div></div>`}).join("");
 return h}
function adm(){
 const d=adminDay,ov=adminOv,S=st.settings||{};
 let h=`<div class="top"><div><h1>Керування</h1><small>Тільки для адмінів</small></div></div><h2 style="margin-top:6px">Уроки</h2><input type="date" id="ad" value="${adminDate}">`;
 if(!d)h+=`<div class="empty">Не вдалося завантажити день</div>`;
 else{if(d.holiday)h+=`<div class="box sm">У цей день канікули: ${esc(d.holiday.title)}. Уроки не показуються.</div>`;
  h+=d.lessons.map(l=>`<button class="box hl" data-al="${l.number}" style="width:100%;text-align:left"><div><b${l.cancelled?' style="text-decoration:line-through"':""}>${l.number}. ${esc(l.name)}</b><span class="sm">${l.start}–${E(l)}${l.extra?", додатковий":""}${l.remote?", дист.":""}${l.early_end?", раніше":""}${l.cancelled?", скасовано":""}</span></div><span class="sm">Дії ›</span></button>`).join("")||(d.holiday?"":`<div class="box sm">У цей день уроків немає</div>`);
  h+=`<button class="b2" id="addl" style="margin-top:4px;background:var(--card)">+ Додатковий урок</button>`}
 h+=`<h2>Активні зміни</h2>`+(!ov?`<div class="box sm">Не вдалося завантажити</div>`:ov.changes.length?ov.changes.map((c,i)=>`<div class="box hl"><div><b>${fd(c.date)}, ${c.number}. ${esc(c.name)}</b><span class="sm">${esc(c.text)}</span></div><button class="b2" data-undo="${i}">Зняти</button></div>`).join(""):`<div class="box sm">Змін на найближчі 3 тижні немає</div>`);
 h+=`<h2>Канікули</h2>`+(st.holidays.length?st.holidays.map(x=>`<div class="box hl"><div><b>${esc(x.title)}</b><span class="sm">${fd(x.from)} – ${fd(x.to)}</span></div><button class="b2 rd" data-hd="${x.id}">Видалити</button></div>`).join(""):`<div class="box sm">Канікул не додано</div>`);
 h+=`<div class="two"><div><label>Від</label><input type="date" id="hf"></div><div><label>До (включно)</label><input type="date" id="ht"></div></div><input id="hn" placeholder="Назва, наприклад: Осінні канікули"><button class="go" id="hadd">Додати канікули</button>`;
 h+=`<h2>Повідомлення в чат</h2><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${["Сьогодні уроки дистанційно.","Сьогодні уроки очно.","Увага: зміни в розкладі, дивіться застосунок."].map((t,i)=>`<button class="b2" style="background:var(--card)" data-tpl="${i}">${["Дистанційно","Очно","Зміни"][i]}</button>`).join("")}</div><textarea id="an" rows="3" placeholder="Текст повідомлення для класного чату"></textarea><button class="go" id="asend">Надіслати в чат</button>`;
 h+=`<h2>Налаштування</h2><label class="box hl" style="color:var(--tx);font-size:16px;margin:0 0 8px"><span><b>Сповіщення про тривоги в чат</b><span class="sm">${S.alerts_muted?"Вимкнено адміном":"Увімкнено"}</span></span><input type="checkbox" id="mute" ${S.alerts_muted?"":"checked"} style="width:22px;height:22px;margin:0"></label>`;
 h+=`<label class="box hl" style="color:var(--tx);font-size:16px;margin:0 0 8px"><span><b>Технічні роботи</b><span class="sm">${S.maintenance?"Увімкнено: користувачі бачать заглушку":"Вимкнено"}</span></span><input type="checkbox" id="mnt" ${S.maintenance?"checked":""} style="width:22px;height:22px;margin:0"></label><textarea id="mmsg" rows="2" placeholder="Повідомлення для користувачів (необов'язково)">${esc(S.maintenance_message||"")}</textarea><button class="b2" id="msave" style="background:var(--card)">Зберегти текст</button>`;
 if(ov){const g=ov.diag;h+=`<h2>Система</h2><div class="box sm">Бот працює ${fm(g.uptime_min)||"менше хвилини"}<br>Область: ${esc(g.region)}, адмінів: ${g.admins}<br>Сховище: ${g.persistent?"постійне (DATA_DIR)":"тимчасове, зникає при деплої"}<br>Файли: ${Object.keys(g.files).map(k=>k.replace(".json","")+" "+g.files[k]+" Б").join(", ")||"немає"}</div>`}
 return h}
function render(){
 const A=$("app");
 if(st&&st.maintenance){A.innerHTML=`<div class="top"><h1>Розклад</h1></div><div class="al yl"><div class="k">Технічні роботи</div><div class="t">Скоро повернемось</div><div class="k">${esc(st.maintenance.message||"Застосунок тимчасово недоступний. Розклад можна дізнатися в чаті командою /today.")}</div></div><button class="go" onclick="boot()">Перевірити знову</button>`;$("tabs").innerHTML="";return}
 if(st&&st.err){A.innerHTML=`<div class="top"><h1>Розклад</h1></div><div class="empty">Не вдалося зв'язатися з ботом.<br><br>${API?"Перевірте, що бот працює і має публічну адресу (Railway: Settings, Networking, Generate Domain).":"Відкрийте застосунок командою /app у боті: адреса бота передається автоматично."}</div><button class="go" onclick="boot()">Спробувати знову</button>`;$("tabs").innerHTML="";return}
 A.innerHTML=tab==="sch"?sch():tab==="al"?alr():adm();
 const a=st.alert,T=[["sch","Розклад"],["al",a.active?"🚨 Тривоги":"Тривоги"]];if(admin)T.push(["adm","Керування"]);
 $("tabs").innerHTML=T.map(([k,n])=>`<button data-t="${k}" class="${k===tab?"on":""}">${n}</button>`).join("");
}
$("tabs").onclick=async e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;hap();if(tab==="adm")await loadAdmin2();render();scrollTo(0,0)};
const loadAdmin2=async()=>{await loadAdminDay()};
$("app").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const D_=b.dataset;
 if(D_.go){tab="al";hap();return render()}
 if(D_.wv!==undefined)wv=D_.wv==="1";
 if(D_.d||D_.wv!==undefined){if(D_.d)sel=D_.d;hap();return render()}
 if(D_.w!==undefined){off=D_.w==="0"?0:off+ +D_.w;sel=null;hap();await load();return render()}
 if(D_.n){const l=st.days[sel].lessons.find(x=>x.number==D_.n),k=sel+"|"+l.number;
  return sheet(`<h3 style="margin:0 0 2px;font-size:20px">${esc(l.name)}</h3><div class="sm" style="margin-bottom:12px">${DF[wd(U(sel))]}, ${fd(sel)}, ${l.number}-й урок</div><textarea id="ta" rows="4" placeholder="Що задали або що взяти з собою">${esc(notes[k]||"")}</textarea><button class="go" id="sv">Зберегти</button>${notes[k]?'<button class="go" id="dl" style="background:var(--card);color:var(--tx)">Видалити</button>':""}`),
  $("sv").onclick=()=>{const v=$("ta").value.trim();if(v)notes[k]=v;else delete notes[k];saveN();closeSheet();render()},
  $("dl")&&($("dl").onclick=()=>{delete notes[k];saveN();closeSheet();render()})}
 if(tab!=="adm")return;
 if(D_.al){curL=adminDay.lessons.find(x=>x.number==D_.al);const l=curL,nowT=new Date().toLocaleTimeString("en-GB",{timeZone:"Europe/Kyiv",hour:"2-digit",minute:"2-digit"}),sc='style="background:var(--card);color:var(--tx)"';
  return sheet(`<h3 style="margin:0 0 2px;font-size:20px">${l.number}. ${esc(l.name)}</h3><div class="sm" style="margin-bottom:10px">${fd(adminDate)}, ${l.start}–${E(l)}</div><button class="go" data-a="cx">${l.cancelled?"Повернути урок":"Скасувати урок"}</button><button class="go" ${sc} data-a="tm">Змінити час</button>${l.early_end?`<button class="go" ${sc} data-a="enc">Скасувати дострокове завершення (${l.early_end})</button>`:`<div class="two" style="margin-top:8px"><input type="time" id="et" value="${nowT}" style="margin:0"><button class="go" ${sc} style="margin:0;background:var(--card);color:var(--tx)" data-a="en">Завершити о цій годині</button></div>`}${l.remote_capable?`<button class="go" ${sc} data-a="ip">${l.remote?"Буде очно":"Зробити дистанційним"}</button>`:""}${l.extra?`<button class="go" ${sc} data-a="rm" style="background:var(--card);color:var(--rd)">Видалити додатковий урок</button>`:""}`)}
 if(D_.undo){const c=adminOv.changes[+D_.undo];return act(()=>undo(c),"Зміну знято")}
 if(D_.hd)return act(()=>post("/api/admin/holiday",{remove:D_.hd}),"Канікули видалено");
 if(D_.tpl!==undefined){$("an").value=["Сьогодні уроки дистанційно.","Сьогодні уроки очно.","Увага: зміни в розкладі, дивіться застосунок."][+D_.tpl];return}
 if(b.id==="addl"){sheet(`<h3 style="margin:0 0 12px">Додатковий урок на ${fd(adminDate)}</h3><div class="two"><div><label>Номер</label><input type="number" id="xn" min="0" max="12" value="0"></div><div><label>Назва</label><input id="xm"></div><div><label>Початок</label><input type="time" id="xs"></div><div><label>Кінець</label><input type="time" id="xe"></div></div><button class="go" id="ok">Додати</button>`);
  $("ok").onclick=()=>{const v=[$("xn").value,$("xm").value,$("xs").value,$("xe").value];closeSheet();act(()=>post("/api/admin/lesson",{date:adminDate,number:+v[0],name:v[1],start:v[2],end:v[3]}),"Урок додано")};return}
 if(b.id==="msave")return act(()=>post("/api/admin/settings",{key:"maintenance_message",value:$("mmsg").value}),"Текст збережено");
 if(b.id==="hadd"){const f=$("hf").value,t=$("ht").value;if(!f||!t)return toast("Вкажіть обидві дати");return act(()=>post("/api/admin/holiday",{from:f,to:t,title:$("hn").value}),"Канікули додано")}
 if(b.id==="asend"){const v=$("an").value.trim();if(!v)return toast("Введіть текст");if(!confirm("Надіслати в чат класу?"))return;return act(()=>post("/api/admin/announce",{text:v}),"Надіслано")}
};
$("panel").onclick=e=>{const b=e.target.closest("[data-a]");if(!b||!curL)return;const l=curL,n=l.number,date=adminDate,k=b.dataset.a,sc='style="background:var(--card);color:var(--tx)"';
 if(k==="tm"){sheet(`<h3 style="margin:0 0 12px">${n}-й урок: змінити час</h3><div class="two"><div><label>Початок</label><input type="time" id="s1" value="${l.start}"></div><div><label>Кінець</label><input type="time" id="e1" value="${l.end}"></div></div><button class="go" id="ok">Зберегти</button><button class="go" ${sc} id="clr">Повернути за розкладом</button>`);
  $("ok").onclick=()=>{const v=[$("s1").value,$("e1").value];closeSheet();act(()=>post("/api/admin/time",{date,number:n,start:v[0],end:v[1]}),"Час змінено")};
  $("clr").onclick=()=>{closeSheet();act(()=>post("/api/admin/time",{date,number:n,clear:true}),"Час повернуто")};return}
 const v=k==="en"?$("et").value:"";closeSheet();
 if(k==="cx")return act(()=>post("/api/admin/cancel",{date,number:n,cancel:!l.cancelled}),l.cancelled?"Урок повернуто":"Урок скасовано");
 if(k==="en")return act(()=>post("/api/admin/endnow",{date,number:n,time:v}),"Урок завершено раніше");
 if(k==="enc")return act(()=>post("/api/admin/endnow",{date,number:n,clear:true}),"Завершення скасовано");
 if(k==="ip")return act(()=>post("/api/admin/inperson",{date,number:n,value:l.remote}),l.remote?"Урок буде очно":"Позначено дистанційним");
 if(k==="rm")return act(()=>post("/api/admin/lesson",{date,number:n,remove:true}),"Урок видалено")};
$("app").onchange=async e=>{if(e.target.id==="ad"&&e.target.value){adminDate=e.target.value;await loadAdminDay();render()}
 if(e.target.id==="mnt")act(()=>post("/api/admin/settings",{key:"maintenance",value:e.target.checked}),e.target.checked?"Технічні роботи увімкнено":"Застосунок знову відкрито");
 if(e.target.id==="mute")act(()=>post("/api/admin/settings",{key:"alerts_muted",value:!e.target.checked}),e.target.checked?"Сповіщення увімкнено":"Сповіщення вимкнено")};
async function boot(){await load();if(!st.err)await loadAdmin();render()}
boot();
setInterval(async()=>{if($("sheet").classList.contains("on")||tab==="adm")return;await load();render()},15000);
</script>
</body>
</html>
