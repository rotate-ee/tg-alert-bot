/* === Liquid Glass bottom bar === */
.tabs{
  gap:6px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  border:1px solid color-mix(in srgb,var(--tx) 14%,transparent);
  border-bottom:0;
  border-radius:24px 24px 0 0;
  background:
    linear-gradient(180deg, color-mix(in srgb,var(--tx) 6%,transparent) 0%, transparent 18%),
    color-mix(in srgb,var(--card) 72%,transparent);
  box-shadow:
    0 -12px 40px color-mix(in srgb,var(--tx) 10%,transparent),
    inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent),
    inset 0 -1px 0 color-mix(in srgb,var(--tx) 6%,transparent);
  backdrop-filter:blur(28px) saturate(1.55) brightness(1.05);
  -webkit-backdrop-filter:blur(28px) saturate(1.55) brightness(1.05);
  isolation:isolate;
}
:root[data-theme="dark"] .tabs,
html:not([data-theme="light"]) .tabs{
  background:
    linear-gradient(180deg, color-mix(in srgb,#fff 9%,transparent) 0%, transparent 20%),
    color-mix(in srgb,var(--card) 55%,transparent);
  border-color:color-mix(in srgb,#fff 12%,transparent);
  box-shadow:
    0 -14px 42px rgba(0,0,0,.35),
    inset 0 1px 0 color-mix(in srgb,#fff 14%,transparent),
    inset 0 -1px 0 rgba(0,0,0,.25);
}
.tabs button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;min-width:0;min-height:58px;padding:6px 3px;border-radius:16px;
  color:var(--hint);font-size:11px;font-weight:650;line-height:1.1;
  transition:background .2s,color .2s,transform .18s,box-shadow .2s;
  position:relative;
}
.tabs button svg{display:block;width:20px;height:20px;flex:none;opacity:.86;transition:transform .18s,opacity .18s}
.tabs button span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs .on{
  background:color-mix(in srgb,var(--ac) 18%,color-mix(in srgb,var(--card) 70%,transparent));
  color:var(--ac);
  box-shadow:
    0 4px 16px color-mix(in srgb,var(--ac) 18%,transparent),
    inset 0 1px 0 color-mix(in srgb,#fff 25%,transparent),
    inset 0 0 0 1px color-mix(in srgb,var(--ac) 22%,transparent);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.tabs .on svg{opacity:1;transform:translateY(-1px)}
.tabs .theme-toggle{
  flex:0 0 44px;min-width:44px;min-height:44px;align-self:center;gap:0;padding:8px;
  border:1px solid color-mix(in srgb,var(--tx) 12%,transparent);
  border-radius:15px;
  background:color-mix(in srgb,var(--card) 65%,transparent);
  color:var(--tx);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 12%,transparent);
}
.tabs .theme-toggle svg{width:19px;height:19px;opacity:1}
.tabs .theme-toggle span{display:none}
.tabs button:active{transform:scale(.95)}
@media(max-width:430px){
  .tabs{gap:4px;padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0}
  .tabs button{min-height:56px;gap:4px;padding:5px 2px;font-size:10px}
  .tabs button svg{width:19px;height:19px}
  .tabs .theme-toggle{flex-basis:42px;min-width:42px;min-height:42px}
}
@media(hover:hover){
  .tabs button:hover{background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--tx)}
  .tabs .on:hover{color:var(--ac)}
}

function stackChart(items,c1,c2){
 const W=340,H=146,L=26,R=4,T=8,B=22,pw=W-L-R,ph=H-T-B,n=items.length,mx=Math.max(3,...items.map(i=>i.a+i.b)),slot=pw/n,bw=Math.max(2,Math.min(18,slot*0.68));
 const sel=statsSel&&items.some(i=>i.date===statsSel)?statsSel:(([...items].reverse().find(i=>i.a+i.b)||items[n-1]).date);
 let g="";
 [0,Math.round(mx/2),mx].forEach(v=>{const y=T+ph-ph*v/mx;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="gl"/><text x="${L-6}" y="${y+3}" class="ax" text-anchor="end">${v}</text>`});
 items.forEach((d,i)=>{const x=L+i*slot+(slot-bw)/2,ha=ph*d.a/mx,hb=ph*d.b/mx;
  g+=`<g data-bar="${d.date}" class="bar">${d.date===sel?`<rect x="${L+i*slot}" y="${T}" width="${slot}" height="${ph}" class="selbg"/>`:`<rect x="${L+i*slot}" y="${T}" width="${slot}" height="${ph}" fill="transparent"/>`}`;
  if(d.a)g+=`<rect x="${x}" y="${T+ph-ha}" width="${bw}" height="${ha}" rx="2" fill="${c1}"/>`;
  if(d.b)g+=`<rect x="${x}" y="${T+ph-ha-hb}" width="${bw}" height="${hb}" rx="2" fill="${c2}"/>`;
  if(!d.a&&!d.b)g+=`<rect x="${x}" y="${T+ph-1.5}" width="${bw}" height="1.5" fill="var(--line)"/>`;
  g+=`</g>`});
 const lab=(i,anc)=>`<text x="${anc==="start"?L:anc==="end"?W-R:L+i*slot+slot/2}" y="${H-5}" class="ax" text-anchor="${anc}">${fd(items[i].date)}</text>`;
 g+=lab(0,"start")+(n>8?lab(Math.floor(n/2),"middle"):"")+lab(n-1,"end");
 return {svg:`<svg viewBox="0 0 ${W} ${H}" class="av-svg" role="img">${g}</svg>`,sel}}

function clockRing(arr){

 let g="";
 arr.forEach((v,i)=>{const [x0,y0]=pt(ro,i*15+0.9),[x1,y1]=pt(ro,(i+1)*15-0.9),[x2,y2]=pt(ri,(i+1)*15-0.9),[x3,y3]=pt(ri,i*15+0.9);
  g+=`<path d="M${x0.toFixed(2)} ${y0.toFixed(2)}A${ro} ${ro} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}L${x2.toFixed(2)} ${y2.toFixed(2)}A${ri} ${ri} 0 0 0 ${x3.toFixed(2)} ${y3.toFixed(2)}Z" ${v?`fill="var(--rd)" fill-opacity="${(0.2+0.8*v/mx).toFixed(2)}"`:`fill="var(--line)"`}/>`});
 [[0,"00"],[90,"06"],[180,"12"],[270,"18"]].forEach(([deg,t])=>{const [x,y]=pt(ro+11,deg);g+=`<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" class="ax" text-anchor="middle">${t}</text>`});
 const peak=arr.indexOf(Math.max(...arr)),has=arr.some(v=>v);
 g+=has?`<text x="${c}" y="${c-1}" class="rc" text-anchor="middle">${pad2(peak)}–${pad2((peak+1)%24)}</text><text x="${c}" y="${c+14}" class="ax" text-anchor="middle">пік · ${arr[peak]}</text>`:`<text x="${c}" y="${c+4}" class="ax" text-anchor="middle">немає даних</text>`;
 return `<svg viewBox="0 0 180 180" class="av-ring" role="img">${g}</svg>`}

  if(!test){if(!n)return toast("У цій аудиторії поки нікого немає");if(!await askConfirm(`Надіслати повідомлення ${n} користувачам у ЛС?\n\n«${text.slice(0,140)}${text.length>140?"…":""}»`))return}
  if(actBusy)return;actBusy=true;b.disabled=true;
  try{const r=await post("/api/admin/broadcast",{text,audience:aud,button:btn,test});
   if(test)toast("Тест надіслано вам у ЛС");else{toast(`Розсилку запущено: ${r.total} отримувачів. Звіт прийде вам у ЛС`);$("bc-text").value="";await loadAdminUsers();render()}}
  catch(x){toast(x===409?(test?"Натисніть Запустити у чаті з ботом, щоб він міг вам писати":"Попередня розсилка ще триває"):x===400?"Перевірте текст і аудиторію":"Не вдалося надіслати")}
  finally{actBusy=false;b.disabled=false}
  return}
 if(b.id==="backup-send"){if(actBusy)return;let r={};return act(async()=>{r=await post("/api/admin/backup/send",{})},()=>`Копію надіслано в Telegram (файлів: ${r.files})`)}
 if(b.id==="msave")return act(()=>post("/api/admin/settings",{key:"maintenance_message",value:$("mmsg").value}),"Текст збережено");
 if(b.id==="ticker-save"){const text=$("ticker-text").value.trim();return act(()=>post("/api/admin/settings",{key:"ticker_text",value:text}),text?"Оголошення показується":"Бігучий рядок прибрано")}
 if(D_.wd)return act(()=>post("/api/admin/week_shift",{remove:D_.wd}),"Зсув видалено");
 if(b.id==="wsadd"){const f=$("wsd").value;if(!f)return toast("Вкажіть дату");return act(()=>post("/api/admin/week_shift",{from:f,school:$("wst").value==="1"}),"Чергування зсунуто")}
 if(D_.rd)return act(()=>post("/api/admin/remote_period",{remove:D_.rd}),"Період видалено");
 if(D_.ra){const e=U(D_.ra),k=(7-wd(e))%7||7,s0=new Date(e.getTime()+k*D),e0=new Date(s0.getTime()+6*D);return act(()=>post("/api/admin/remote_period",{from:iso(s0),to:iso(e0),title:"Дистанційний тиждень"}),"Додано: "+fd(iso(s0))+" – "+fd(iso(e0)))}
 if(b.id==="rpadd"){const f=$("rpf").value,t=$("rpt").value;if(!f||!t)return toast("Вкажіть обидві дати");return act(()=>post("/api/admin/remote_period",{from:f,to:t,title:$("rpn").value}),"Період додано")}
 if(b.id==="remote-day")return act(()=>post("/api/admin/remote_period",{from:adminDate,to:adminDate,title:"Дистанційний день"}),"Увесь день переведено на дистанційне")
 if(b.id==="hadd"){const f=$("hf").value,t=$("ht").value;if(!f||!t)return toast("Вкажіть обидві дати");return act(()=>post("/api/admin/holiday",{from:f,to:t,title:$("hn").value}),"Канікули додано")}
 if(b.id==="asend"){const v=$("an").value.trim();if(!v)return toast("Введіть текст");if(!await askConfirm("Надіслати в чат класу?"))return;return act(()=>post("/api/admin/announce",{text:v}),"Надіслано")}
};
$("panel").onclick=e=>{const b=e.target.closest("[data-a]");if(!b||!curL)return;const l=curL,n=l.number,date=adminDate,k=b.dataset.a,sc='style="background:var(--card);color:var(--tx)"';
 if(k==="rn"){sheet(`<h3 style="margin:0 0 6px">${n}-й урок: змінити номер</h3><div class="sm" style="margin-bottom:10px">Час зміниться за дзвінками нового номера (0-й урок: 45 хв перед першим, час можна змінити вручну). Якщо номер зайнятий, уроки поміняються місцями.</div>${appChoice("rnn",[0,1,2,3,4,5,6,7,8].map(x=>[String(x),x===0?"0 (перед першим уроком)":String(x)]),String(n))}<button class="go" id="ok">Зберегти</button>`);
  $("ok").onclick=()=>{const t=+$("rnn").value;closeSheet();if(t!==n)act(()=>post("/api/admin/renumber",{date,number:n,target:t}),"Номер змінено")};return}
 if(k==="tm"){sheet(`<h3 style="margin:0 0 12px">${n}-й урок: змінити час</h3><div class="two"><div><label>Початок</label>${timeControl("s1",l.start)}</div><div><label>Кінець</label>${timeControl("e1",l.end)}</div></div><button class="go" id="ok">Зберегти</button><button class="go" ${sc} id="clr">Повернути за розкладом</button>`);
  $("ok").onclick=()=>{const v=[$("s1").value,$("e1").value];closeSheet();act(()=>post("/api/admin/time",{date,number:n,start:v[0],end:v[1]}),"Час змінено")};
  $("clr").onclick=()=>{closeSheet();act(()=>post("/api/admin/time",{date,number:n,clear:true}),"Час повернуто")};return}
 const v=k==="en"?$("et").value:"";closeSheet();
 if(k==="groupremote"||k==="groupcancel"){const subgroup=b.dataset.group,group=adminDay.lessons.find(item=>item.number===n&&item.subgroup===subgroup),value=b.dataset.value==="1";if(!group)return;const request=k==="groupremote"?post("/api/admin/remote",{date,number:n,subgroup,value}):post("/api/admin/cancel",{date,number:n,subgroup,cancel:value});return act(()=>request,k==="groupremote"?(value?"Групу переведено на дистанційне":"Для групи повернуто очний формат"):(value?"Урок групи позначено як Класрум":"Урок групи відновлено"))}
 if(k==="cx")return act(()=>post("/api/admin/cancel",{date,number:n,subgroup:l.subgroup,cancel:!l.cancelled}),l.subgroup?(l.cancelled?"Класрум скасовано":"Позначено Класрум"):l.cancelled?"Урок повернуто":"Урок скасовано");
 if(k==="en")return act(()=>post("/api/admin/endnow",{date,number:n,time:v}),"Урок завершено раніше");
 if(k==="enc")return act(()=>post("/api/admin/endnow",{date,number:n,clear:true}),"Завершення скасовано");
 if(k==="remote")return act(()=>post("/api/admin/remote",{date,number:n,value:!l.remote}),l.remote?"Урок позначено очним":"Урок позначено дистанційним");
 if(k==="rm")return act(()=>post("/api/admin/lesson",{date,number:n,remove:true}),"Урок видалено")};
$("app").onchange=async e=>{if(e.target.dataset&&e.target.dataset.sub){setSubscription();return}
 if(e.target.id==="ad"&&e.target.value){adminDate=e.target.value;await loadAdminDay();render()}
 if(e.target.id==="mute")act(()=>post("/api/admin/settings",{key:"alerts_muted",value:!e.target.checked}),e.target.checked?"Сповіщення увімкнено":"Сповіщення вимкнено")};
async function boot(){if(!st)$("app").innerHTML='<div class="box sm" style="margin-top:24px">Завантажуємо застосунок…</div>';await load();if(!st.err)await loadAdmin();await pingActivity();render()}
boot();
let pollTimer=null,activityTimer=null;
function startPolling(){stopPolling();
pollTimer=setInterval(async()=>{if($("sheet").classList.contains("on")||tab==="adm")return;await load();if(tab==="dut")await loadDutySchedule();if(tab==="al")refreshAlertPage();else render()},15000);
activityTimer=setInterval(async()=>{await pingActivity();if(tab!=="adm"||$("sheet").classList.contains("on"))return;await loadActivity();const section=$("activity-section");if(section){const wasOpen=section.open,holder=document.createElement("div");holder.innerHTML=activityBlock();const updated=holder.querySelector("#activity-section");if(updated){updated.open=wasOpen;section.replaceWith(updated)}}},15000);}
function stopPolling(){clearInterval(pollTimer);clearInterval(activityTimer)}
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopPolling();else{boot();startPolling()}});
startPolling();
</script>
