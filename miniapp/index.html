  return sheet(`<h3 style="margin:0 0 2px;font-size:20px">${l.number}. ${esc(l.name)}</h3><div class="sm" style="margin-bottom:10px">${fd(adminDate)}, ${l.start}–${E(l)}</div><button class="go" data-a="cx">${l.cancelled?"Повернути урок":"Скасувати урок"}</button><button class="go" ${sc} data-a="tm">Змінити час</button>${l.extra?"":`<button class="go" ${sc} data-a="rn">Змінити номер уроку</button>`}${l.early_end?`<button class="go" ${sc} data-a="enc">Скасувати дострокове завершення (${l.early_end})</button>`:`<div class="two" style="margin-top:8px"><input type="time" id="et" value="${nowT}" style="margin:0"><button class="go" ${sc} style="margin:0;background:var(--card);color:var(--tx)" data-a="en">Завершити о цій годині</button></div>`}${l.remote_capable?`<button class="go" ${sc} data-a="ip">${l.remote?"Буде очно":"Зробити дистанційним"}</button>`:""}${l.extra?`<button class="go" ${sc} data-a="rm" style="background:var(--card);color:var(--rd)">Видалити додатковий урок</button>`:""}`)}
 if(D_.undo){const c=adminOv.changes[+D_.undo];return act(()=>undo(c),"Зміну знято")}
 if(D_.hd)return act(()=>post("/api/admin/holiday",{remove:D_.hd}),"Канікули видалено");
 if(D_.tpl!==undefined){$("an").value=["Сьогодні уроки дистанційно.","Сьогодні уроки очно.","Увага: зміни в розкладі, дивіться застосунок."][+D_.tpl];return}
 if(b.id==="addl"){sheet(`<h3 style="margin:0 0 12px">Додатковий урок на ${fd(adminDate)}</h3><div class="two"><div><label>Номер</label><input type="number" id="xn" min="0" max="12" value="0"></div><div><label>Назва</label><input id="xm"></div><div><label>Початок</label><input type="time" id="xs"></div><div><label>Кінець</label><input type="time" id="xe"></div></div><button class="go" id="ok">Додати</button>`);
  $("ok").onclick=()=>{const v=[$("xn").value,$("xm").value,$("xs").value,$("xe").value];closeSheet();act(()=>post("/api/admin/lesson",{date:adminDate,number:+v[0],name:v[1],start:v[2],end:v[3]}),"Урок додано")};return}
 if(b.id==="rnreset")return act(()=>post("/api/admin/renumber",{date:adminDate,reset:true}),"Нумерацію скинуто");
 if(b.id==="linkadd"){document.querySelector("#lesson-link-rows").insertAdjacentHTML("beforeend",lessonLinkRow());return}
 if(D_.linkRemove!==undefined){b.closest(".lesson-link-row").remove();return}
 if(b.id==="links-save"){const links={};for(const row of document.querySelectorAll(".lesson-link-row")){const name=row.querySelector(".lesson-link-subject").value,url=row.querySelector(".lesson-link-url").value.trim();if(!name&&!url)continue;if(!name||!url)return toast("Оберіть урок і додайте посилання для кожного рядка");if(links[name])return toast("Для цього уроку посилання вже додано");try{const parsed=new URL(url);if(parsed.protocol!=="https:"||!parsed.hostname)throw 0}catch(e){return toast("Вкажіть дійсне посилання HTTPS")};links[name]=url}return act(()=>post("/api/admin/settings",{key:"remote_lesson_links",value:links}),"Посилання збережено")}
 if(b.id==="sendsave")return act(()=>post("/api/admin/settings",{key:"schedule_end",value:$("send").value}),"Дату збережено");
 if(b.id==="msave")return act(()=>post("/api/admin/settings",{key:"maintenance_message",value:$("mmsg").value}),"Текст збережено");
 if(D_.wd)return act(()=>post("/api/admin/week_shift",{remove:D_.wd}),"Зсув видалено");
 if(b.id==="wsadd"){const f=$("wsd").value;if(!f)return toast("Вкажіть дату");return act(()=>post("/api/admin/week_shift",{from:f,school:$("wst").value==="1"}),"Чергування зсунуто")}
 if(D_.rd)return act(()=>post("/api/admin/remote_period",{remove:D_.rd}),"Період видалено");
 if(D_.ra){const e=U(D_.ra),k=(7-wd(e))%7||7,s0=new Date(e.getTime()+k*D),e0=new Date(s0.getTime()+6*D);return act(()=>post("/api/admin/remote_period",{from:iso(s0),to:iso(e0),title:"Дистанційний тиждень"}),"Додано: "+fd(iso(s0))+" – "+fd(iso(e0)))}
 if(b.id==="rpadd"){const f=$("rpf").value,t=$("rpt").value;if(!f||!t)return toast("Вкажіть обидві дати");return act(()=>post("/api/admin/remote_period",{from:f,to:t,title:$("rpn").value}),"Період додано")}
 if(b.id==="hadd"){const f=$("hf").value,t=$("ht").value;if(!f||!t)return toast("Вкажіть обидві дати");return act(()=>post("/api/admin/holiday",{from:f,to:t,title:$("hn").value}),"Канікули додано")}
 if(b.id==="asend"){const v=$("an").value.trim();if(!v)return toast("Введіть текст");if(!confirm("Надіслати в чат класу?"))return;return act(()=>post("/api/admin/announce",{text:v}),"Надіслано")}
};
$("panel").onclick=e=>{const b=e.target.closest("[data-a]");if(!b||!curL)return;const l=curL,n=l.number,date=adminDate,k=b.dataset.a,sc='style="background:var(--card);color:var(--tx)"';
 if(k==="rn"){sheet(`<h3 style="margin:0 0 6px">${n}-й урок: змінити номер</h3><div class="sm" style="margin-bottom:10px">Час зміниться за дзвінками нового номера (0-й урок: 45 хв перед першим, час можна змінити вручну). Якщо номер зайнятий, уроки поміняються місцями.</div>${appChoice("rnn",[0,1,2,3,4,5,6,7,8].map(x=>[String(x),x===0?"0 (перед першим уроком)":String(x)]),String(n))}<button class="go" id="ok">Зберегти</button>`);
  $("ok").onclick=()=>{const t=+$("rnn").value;closeSheet();if(t!==n)act(()=>post("/api/admin/renumber",{date,number:n,target:t}),"Номер змінено")};return}
 if(k==="tm"){sheet(`<h3 style="margin:0 0 12px">${n}-й урок: змінити час</h3><div class="two"><div><label>Початок</label><input type="time" id="s1" value="${l.start}"></div><div><label>Кінець</label><input type="time" id="e1" value="${l.end}"></div></div><button class="go" id="ok">Зберегти</button><button class="go" ${sc} id="clr">Повернути за розкладом</button>`);
  $("ok").onclick=()=>{const v=[$("s1").value,$("e1").value];closeSheet();act(()=>post("/api/admin/time",{date,number:n,start:v[0],end:v[1]}),"Час змінено")};
  $("clr").onclick=()=>{closeSheet();act(()=>post("/api/admin/time",{date,number:n,clear:true}),"Час повернуто")};return}
 const v=k==="en"?$("et").value:"";closeSheet();
 if(k==="cx")return act(()=>post("/api/admin/cancel",{date,number:n,cancel:!l.cancelled}),l.cancelled?"Урок повернуто":"Урок скасовано");
 if(k==="en")return act(()=>post("/api/admin/endnow",{date,number:n,time:v}),"Урок завершено раніше");
 if(k==="enc")return act(()=>post("/api/admin/endnow",{date,number:n,clear:true}),"Завершення скасовано");
 if(k==="ip")return act(()=>post("/api/admin/inperson",{date,number:n,value:l.remote}),l.remote?"Урок буде очно":"Позначено дистанційним");
 if(k==="rm")return act(()=>post("/api/admin/lesson",{date,number:n,remove:true}),"Урок видалено")};
$("app").onchange=async e=>{if(e.target.id==="ad"&&e.target.value){adminDate=e.target.value;await loadAdminDay();render()}
 if(e.target.id==="mnt")act(()=>post("/api/admin/settings",{key:"maintenance",value:e.target.checked}),e.target.checked?"Технічні роботи увімкнено":"Застосунок знову відкрито");
 if(e.target.id==="mute")act(()=>post("/api/admin/settings",{key:"alerts_muted",value:!e.target.checked}),e.target.checked?"Сповіщення увімкнено":"Сповіщення вимкнено")};

boot();
setInterval(async()=>{if($("sheet").classList.contains("on")||tab==="adm")return;await load();if(tab==="dut")await loadDutySchedule();render()},15000);
