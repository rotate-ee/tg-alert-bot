<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const qs=new URLSearchParams(location.search);

const hdr=()=>({"Content-Type":"application/json","X-Init-Data":tg?tg.initData:""});

const $=id=>document.getElementById(id),D=864e5,esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function lessonNames(){const names=[...(st.lesson_names||[]),...Object.values(st.days||{}).flatMap(d=>(d.lessons||[]).map(l=>l.name)),...Object.keys(st.settings?.remote_lesson_links||{})];return [...new Set(names.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"uk"))}
function appChoice(id,options,selected="",placeholder="Оберіть"){return `<div class="app-choice"><input type="hidden" ${id?`id="${id}"`:""} class="app-choice-value" value="${esc(selected)}"><button class="app-choice-toggle" type="button" data-app-choice-toggle aria-expanded="false"><span class="app-choice-label">${esc(options.find(([value])=>String(value)===String(selected))?.[1]||placeholder)}</span><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="app-choice-menu" hidden><input class="app-choice-search" type="search" placeholder="Пошук" aria-label="Пошук варіантів"><div class="app-choice-options">${options.map(([value,label])=>`<button class="app-choice-option ${String(value)===String(selected)?"selected":""}" type="button" data-app-choice-value="${esc(value)}">${esc(label)}</button>`).join("")}</div></div></div>`}
function appChoiceClick(e){const toggle=e.target.closest("[data-app-choice-toggle]");if(toggle){const field=toggle.closest(".app-choice"),menu=field.querySelector(".app-choice-menu"),open=menu.hidden;document.querySelectorAll(".app-choice-menu").forEach(x=>x.hidden=true);document.querySelectorAll(".app-choice").forEach(x=>{x.classList.remove("open");x.querySelector("[data-app-choice-toggle]").setAttribute("aria-expanded","false")});if(open){menu.hidden=false;field.classList.add("open");toggle.setAttribute("aria-expanded","true");const search=field.querySelector(".app-choice-search");search.value="";field.querySelectorAll(".app-choice-option").forEach(x=>x.hidden=false);search.focus()}return true}const option=e.target.closest("[data-app-choice-value]");if(option){if(option.disabled)return true;const field=option.closest(".app-choice"),hidden=field.querySelector(".app-choice-value");hidden.value=option.dataset.appChoiceValue;field.querySelector(".app-choice-label").textContent=option.textContent;field.querySelector(".app-choice-menu").hidden=true;field.classList.remove("open");field.querySelector("[data-app-choice-toggle]").setAttribute("aria-expanded","false");field.querySelectorAll(".app-choice-option").forEach(x=>x.classList.toggle("selected",x===option));const linkSubject=field.closest(".lesson-link-row")?.querySelector(".lesson-link-subject");if(linkSubject)linkSubject.value=hidden.value;syncDutyChoices();return true}return false}

const DN=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"],DF=["Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота","Неділя"];

const col=n=>{const k=Object.keys(HUE).find(k=>n.startsWith(k));const h=k?HUE[k]:[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360;return k==="ЗБД"?"hsl(0 0% 55%)":`hsl(${h} 68% 56%)`};
function kyiv(){const p=Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Kyiv",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));return new Date(Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute))}
const iso=d=>d.toISOString().slice(0,10),fd=s=>s.slice(8,10)+"."+s.slice(5,7),U=s=>new Date(s+"T00:00:00Z"),wd=d=>(d.getUTCDay()+6)%7;
const mins=s=>{const[a,b]=s.split(":");return+a*60+ +b},fm=m=>m>=60?Math.floor(m/60)+" год "+(m%60?m%60+" хв":""):m+" хв";
const mon=d=>new Date(U(iso(d)).getTime()-wd(d)*D);
let tab="sch",off=0,sel=null,st=null,offline=false,admin=false,adminDay=null,adminDate=null,adminOv=null,wv=false,curL=null,datePickerTarget="",calendarCursor=null,alertSvgSource=null;
try{const savedTheme=localStorage.getItem("ui-theme");if(savedTheme==="light"||savedTheme==="dark")document.documentElement.dataset.theme=savedTheme}catch(e){}

function dateLabel(value){return value?`${fd(value)}.${value.slice(0,4)}`:"Оберіть дату"}
function dateControl(id,value=""){
 const label=dateLabel(value);

function drawCalendar(){
 const year=calendarCursor.getUTCFullYear(),month=calendarCursor.getUTCMonth(),first=new Date(Date.UTC(year,month,1)),offset=(first.getUTCDay()+6)%7,count=new Date(Date.UTC(year,month+1,0)).getUTCDate(),selected=$(datePickerTarget)?.value||"",today=iso(kyiv());

async function load(){
 const now=kyiv();let base=new Date(mon(now).getTime()+(wd(now)>4?7*D:0)+off*7*D);
 try{st=await get(`/api/state?from=${iso(base)}&days=7`);offline=false;if(st.maintenance)return;st.base=iso(base);try{localStorage.setItem("cache",JSON.stringify(st))}catch(e){}}

}

function sch(){
 const now=kyiv(),t=iso(now),cur=now.getUTCHours()*60+now.getUTCMinutes(),day=st.days[sel],L=day.lessons;

 h+=banner();
 h+=`<div class="strip">${days.map(k=>`<button data-d="${k}" class="${k===sel?"sel ":""}${k===t?"tod ":""}${st.days[k].holiday?"hol":""}"><b>${DN[wd(U(k))]}</b><span>${+k.slice(8)}</span></button>`).join("")}</div>`;
 h+=`<div class="nav"><button data-w="-1">‹ Минулий</button><button data-w="0">Сьогодні</button><button data-w="1">Наступний ›</button></div>`;
 if(wv)return h+wkv();
 const isT=sel===t,live=L.filter(l=>!l.cancelled),c=isT&&live.find(l=>cur>=mins(l.start)&&cur<mins(E(l))),nx=isT&&live.find(l=>mins(l.start)>cur);
 if(day.ended)h+=`<div class="hero hol"><div class="k">Навчальний рік завершено</div><div class="t">Уроків більше немає</div><div class="k">Розклад діяв до ${st.settings&&st.settings.schedule_end?fd(st.settings.schedule_end)+"."+st.settings.schedule_end.slice(0,4):"кінця навчання"}</div></div>`;
